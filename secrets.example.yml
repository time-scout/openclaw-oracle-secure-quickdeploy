# Copy this file to 'secrets.yml' and fill in your credentials.
# DO NOT COMMIT the real 'secrets.yml' to version control.

# Generate a strong token: openssl rand -hex 32
openclaw_gateway_token: "YOUR_SECURE_RANDOM_TOKEN_HERE"

# LLM Provider API Key (Kilo AI, OpenAI, Anthropic, etc.)
openai_api_key: "sk-YOUR_API_KEY"

# Telegram Bot Token (from @BotFather)
telegram_bot_token: "123456789:ABCDEF..."
